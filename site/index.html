<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e3a8a">
<meta name="description" content="Gestão de turmas e certificados SOBEF.">
<title>Certificados | SOBEF</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('sobef-ui-theme')==='light'?'light':'dark';}catch{document.documentElement.dataset.theme='dark';}</script>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./layout-responsive.css">
<style>#backup,#save-notice,[data-action="connect"]{display:none!important}.heading-actions{flex-wrap:wrap}</style>
<script defer src="./assets/lucide.min.js"></script>
<script defer src="./app.js"></script>
<script defer src="./github-connect.js"></script>
<script defer src="./ui-preferences.js"></script>
<script defer src="./ui-polish.js"></script>
</head>
<body>
<a class="skip" href="#main">Pular para o conteúdo</a>
<aside class="sidebar">
<div class="brand"><strong>SOBEF</strong><span>Certificados</span></div>
<nav aria-label="Navegação principal" style="margin-top:24px">
<button data-view="overview" class="active"><i data-lucide="layout-dashboard"></i>Visão geral</button>
<button data-view="classes"><i data-lucide="layers"></i>Turmas<span id="nav-count" class="nav-count">0</span></button>
<button data-view="calendar"><i data-lucide="calendar-days"></i>Calendário</button>
<button data-view="files"><i data-lucide="folder-open"></i>Arquivos</button>
</nav>
<div class="sidebar-bottom"><button id="theme" class="theme" aria-pressed="false"><i data-lucide="moon"></i><span>Modo escuro</span></button></div>
</aside>
<div class="shell">
<header class="topbar"><strong id="breadcrumb">Visão geral</strong></header>
<main id="main" tabindex="-1">
<div class="heading">
<div><h1 id="page-title">Visão geral</h1><p id="page-desc" hidden></p></div>
<div class="heading-actions"><button class="button" id="import"><i data-lucide="upload"></i>Importar</button><button class="button primary" id="new"><i data-lucide="plus"></i>Nova turma</button></div>
</div>
<div class="scopebar"><label for="year">Ano <select id="year"></select></label><span id="scope-count"></span><button id="backup" class="text-button" hidden>Backup</button></div>
<div id="save-notice" class="notice" hidden><span></span><button class="text-button" id="connect-file" hidden>Arquivo local</button></div>
<div id="feedback" role="status" aria-live="polite" hidden></div>
<section id="overview" class="view" aria-label="Visão geral"></section>
<section id="classes" class="view" aria-label="Turmas" hidden></section>
<section id="calendar" class="view" aria-label="Calendário" hidden></section>
<section id="files" class="view" aria-label="Arquivos" hidden></section>
<footer class="main-footer" hidden></footer>
</main>
</div>
<input type="file" id="input-sheet" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="input-backup" accept=".json" hidden>
<dialog id="modal"><div id="modal-content"></div></dialog>
<dialog id="confirm-modal" aria-labelledby="confirm-title"><form method="dialog"><div class="dialog-head"><h2 id="confirm-title">Confirmar ação</h2></div><p id="confirm-message"></p><div class="dialog-footer"><button class="button" value="cancel">Cancelar</button><button class="button primary" value="confirm">Confirmar</button></div></form></dialog>
</body>
</html>
